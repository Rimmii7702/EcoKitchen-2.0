daemon off;
worker_processes 1;
pid nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_max_body_size 4k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    client_body_temp_path client-body;
    proxy_temp_path proxy-cache;
    fastcgi_temp_path fastcgi-cache;
    uwsgi_temp_path uwsgi-cache;
    scgi_temp_path scgi-cache;

    server {
        listen @PORT@ default_server;
        server_name @HOST@;
        if ($http_host != @HOST@) { return 403; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        root /app/dashboard/dist;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=86400" always;

        location = / {
            try_files /index.html =404;
            expires -1;
        }

        location ~ ^/(assets|notices)/ {
            try_files $uri =404;
            expires 7d;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            # Render terminates TLS and redirects public HTTP at its edge.
            proxy_set_header Host @HOST@;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header Forwarded "";
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Strict-Transport-Security;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        location / { return 404; }
    }
}
