<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to EcoKitchen</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #edf2ee; color: #173629; font: 1rem system-ui; }
    main { width: min(350px, calc(100% - 80px)); padding: 26px; border-radius: 16px; border: 1px solid #d2e1d5; background: white; }
    label, input, button { display: block; width: 100%; box-sizing: border-box; }
    input, button { margin: 5px 0 14px; padding: 10px; font: inherit; border: 1px solid #a6bbae; border-radius: 7px; }
    button { background: #276442; color: white; } #error { color: #92312d; }
  </style>
</head>
<body>
<main>
  <h1>Sign in to EcoKitchen</h1>
  <form id="login">
    <label>Username<input name="username" autocomplete="username" required maxlength="64"></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
    <p id="error" role="alert"></p>
    <button type="submit">Sign in</button>
  </form>
</main>
<script>
  document.getElementById('login').addEventListener('submit', async event => {
    event.preventDefault();
    const form = event.currentTarget;
    const button = form.querySelector('button');
    const output = document.getElementById('error');
    const values = Object.fromEntries(new FormData(form));
    button.disabled = true;
    output.textContent = '';
    try {
      const response = await fetch({{ url_for('auth.login')|tojson }}, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-EcoKitchen-Login': '1'},
        body: JSON.stringify(values),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Sign-in failed.');
      location.replace({{ next_path|tojson }});
    } catch (error) {
      output.textContent = error.message;
      button.disabled = false;
    }
  });
</script>
</body>
</html>
